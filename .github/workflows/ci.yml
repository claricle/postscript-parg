name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  grammar:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # '3.4' must match claricle/postscript's grammar.yml: the artifact's
      # unicode_tables payload key embeds the compiling interpreter's exact
      # version ("onigmo (Ruby X.Y.Z)"), so payload parity only holds when
      # both repos compile and verify under the same ruby. Bumping this
      # (or the patch setup-ruby resolves) requires recompiling
      # postscript.json.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # Pinned to the compiler that built the committed artifact (its
      # envelope records compiler_version) — a floating install breaks the
      # payload-parity check on every parsanol patch release. Mirrors
      # etassia-grammar's CI contract and claricle/postscript's grammar.yml.
      - run: gem install parsanol --no-document -v "$(ruby -rjson -e 'print JSON.parse(File.read("postscript.json"))["compiler_version"]')"
      - name: Grammar tests (embedded accept/reject)
        run: parsanol parg test postscript.parg
      - name: Compile and verify committed artifact payload
        run: |
          parsanol parg compile postscript.parg -o /tmp/fresh.json
          ruby -rjson -e '
            strip = lambda do |f|
              j = JSON.parse(File.read(f))
              j.delete("checksum")
              j.delete("compiler_version")
              j
            end
            unless strip.call("postscript.json") == strip.call("/tmp/fresh.json")
              abort "artifact payload drift: regenerate postscript.json with the released parsanol"
            end
            puts "payload parity OK"
          '
